<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JEPA Crypto Trading Dashboard</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.2/d3.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.21.2/babel.min.js"></script>
    <style>
        .chart-container { position: relative; height: 300px; width: 100%; }
        .tooltip {
            position: absolute;
            padding: 10px;
            background: rgba(0, 0, 0, 0.85);
            color: #fff;
            border-radius: 6px;
            pointer-events: none;
            z-index: 1000;
            font-size: 12px;
        }
        .action-buy { color: #22C55E; }
        .action-sell { color: #EF4444; }
        .action-hold { color: #F59E0B; }
        .card { transition: transform 0.2s, box-shadow 0.2s; }
        .card:hover { transform: translateY(-2px); box-shadow: 0 10px 15px rgba(0, 0, 0, 0.1); }
        .symbol-input { transition: all 0.2s; }
        .symbol-input:focus { border-color: #3B82F6; box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.1); }
        .status-dot { animation: pulse 2s infinite; }
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.7; }
            100% { transform: scale(1); opacity: 1; }
        }
        .rsi-value {
            display: inline-block;
            padding: 0.25rem 0.5rem;
            margin: 0.25rem;
            border-radius: 0.25rem;
            background-color: #f3f4f6;
            font-family: monospace;
        }
        .rsi-value.overbought {
            background-color: #fee2e2;
            color: #b91c1c;
        }
        .rsi-value.oversold {
            background-color: #dcfce7;
            color: #15803d;
        }
    </style>
</head>
<body class="bg-gray-50 min-h-screen font-sans">
    <div id="root"></div>
    <script type="text/babel">
        const { useState, useEffect, useRef } = React;

        const App = () => {
            const [priceData, setPriceData] = useState([]);
            const [tradingActions, setTradingActions] = useState([]);
            const [predictions, setPredictions] = useState(null);
            const [indicators, setIndicators] = useState({});
            const [symbol, setSymbol] = useState("BTCUSDT");
            const [connected, setConnected] = useState(false);
            const [currentPrice, setCurrentPrice] = useState(null);
            const wsRef = useRef(null);
            const tooltipRef = useRef(null);
            const actionsEndRef = useRef(null);

            useEffect(() => {
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    wsRef.current.close();
                }

                const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
                const wsUrl = `${protocol}//${window.location.host}/ws`;
                wsRef.current = new WebSocket(wsUrl);

                wsRef.current.onopen = () => {
                    console.log('WebSocket Connected');
                    setConnected(true);
                };

                wsRef.current.onclose = () => {
                    console.log('WebSocket Disconnected');
                    setConnected(false);
                };

                wsRef.current.onerror = (error) => {
                    console.error('WebSocket Error:', error);
                    setConnected(false);
                };

                wsRef.current.onmessage = (event) => {
                    let data = {};
                    try {
                        data = JSON.parse(event.data);
                    } catch (err) {
                        console.error("Invalid JSON from server:", event.data);
                        return;
                    }

                    if (data.price_history) {
                        setPriceData(data.price_history);
                        if (data.price_history.length > 0) {
                            setCurrentPrice(data.price_history[data.price_history.length - 1].price);
                        }
                    }
                    if (data.trading_actions) {
                        setTradingActions(data.trading_actions);
                    }
                    if (data.model_predictions) {
                        setPredictions(data.model_predictions);
                    }
                    if (data.indicators) {
                        setIndicators(data.indicators);
                    }
                };

                return () => {
                    if (wsRef.current) wsRef.current.close();
                };
            }, [symbol]);

            // Auto-scroll to latest trading action
            useEffect(() => {
                if (actionsEndRef.current) {
                    actionsEndRef.current.scrollIntoView({ behavior: "smooth" });
                }
            }, [tradingActions]);

            const handleSymbolChange = (e) => {
                const newSymbol = e.target.value.toUpperCase();
                setSymbol(newSymbol);
                if (wsRef.current && wsRef.current.readyState === WebSocket.OPEN) {
                    wsRef.current.send(JSON.stringify({ action: 'change_symbol', symbol: newSymbol }));
                }
            };

            const PriceChart = ({ priceData, tradingActions }) => {
                const svgRef = useRef();

                useEffect(() => {
                    if (!priceData.length) return;
                    const width = svgRef.current.parentElement.clientWidth;
                    const height = 250;
                    const margin = { top: 20, right: 30, bottom: 30, left: 50 };
                    const innerWidth = width - margin.left - margin.right;
                    const innerHeight = height - margin.top - margin.bottom;

                    d3.select(svgRef.current).selectAll("*").remove();
                    const xScale = d3.scaleTime()
                        .domain(d3.extent(priceData, d => new Date(d.timestamp)))
                        .range([0, innerWidth]);

                    const yScale = d3.scaleLinear()
                        .domain([d3.min(priceData, d => d.price) * 0.995, d3.max(priceData, d => d.price) * 1.005])
                        .range([innerHeight, 0]);

                    const svg = d3.select(svgRef.current).attr("width", width).attr("height", height);
                    const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

                    g.append("g").attr("transform", `translate(0,${innerHeight})`).call(d3.axisBottom(xScale).ticks(5));
                    g.append("g").call(d3.axisLeft(yScale));

                    const line = d3.line()
                        .x(d => xScale(new Date(d.timestamp)))
                        .y(d => yScale(d.price));

                    g.append("path")
                        .datum(priceData)
                        .attr("fill", "none")
                        .attr("stroke", "#3B82F6")
                        .attr("stroke-width", 2)
                        .attr("d", line);

                    // Create smaller action points with improved styling
                    const actionColor = { 'buy': '#22C55E', 'sell': '#EF4444', 'hold': '#F59E0B' };
                    g.selectAll(".action-point")
                        .data(tradingActions)
                        .enter()
                        .append("circle")
                        .attr("class", "action-point")
                        .attr("cx", d => xScale(new Date(d.timestamp)))
                        .attr("cy", d => yScale(d.price))
                        .attr("r", 3.5) // Smaller radius
                        .attr("fill", d => actionColor[d.action])
                        .attr("stroke", "#fff")
                        .attr("stroke-width", 1)
                        .attr("opacity", 0.85)
                        .on("mouseover", (event, d) => {
                            tooltipRef.current
                                .style("opacity", 1)
                                .html(`<div class='text-sm'><strong>Action:</strong> ${d.action.toUpperCase()}<br/><strong>Price:</strong> $${d.price.toFixed(2)}<br/><strong>Time:</strong> ${new Date(d.timestamp).toLocaleTimeString()}<br/><strong>Reason:</strong> ${d.reason}</div>`)
                                .style("left", `${event.pageX + 10}px`)
                                .style("top", `${event.pageY - 28}px`);
                        })
                        .on("mouseout", () => {
                            tooltipRef.current.style("opacity", 0);
                        });
                }, [priceData, tradingActions]);

                return <div className="chart-container"><svg ref={svgRef}></svg><div className="tooltip" ref={el => tooltipRef.current = d3.select(el)} style={{opacity: 0}}></div></div>;
            };

            const TradingActionsList = ({ actions }) => {
                if (!actions.length) return <div className="text-gray-400 text-center">No trading actions recorded yet.</div>;
                
                // Reverse the actions array to show most recent first
                const reversedActions = [...actions].reverse();
                
                return (
                    <div className="overflow-y-auto max-h-80">
                        <table className="min-w-full divide-y divide-gray-200">
                            <thead className="bg-gray-100 sticky top-0">
                                <tr>
                                    <th className="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Time</th>
                                    <th className="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Action</th>
                                    <th className="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">Price</th>
                                    <th className="px-6 py-3 text-left text-xs font-semibold text-gray-600 uppercase tracking-wider">RSI</th>
                                </tr>
                            </thead>
                            <tbody className="bg-white divide-y divide-gray-200">
                                {reversedActions.map((action, i) => (
                                    <tr key={i} className="hover:bg-gray-50 transition-colors">
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{new Date(action.timestamp).toLocaleTimeString()}</td>
                                        <td className="px-6 py-4 whitespace-nowrap text-sm"><span className={`font-semibold action-${action.action}`}>{action.action.toUpperCase()}</span></td>
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-600">${parseFloat(action.price).toFixed(2)}</td>
                                        <td className="px-6 py-4 whitespace-nowrap text-sm text-gray-600">{parseFloat(action.rsi).toFixed(1)}</td>
                                    </tr>
                                ))}
                            </tbody>
                        </table>
                        <div ref={actionsEndRef} />
                    </div>
                );
            };

            const RSIIndicator = ({ rsiData }) => {
                if (!rsiData || !rsiData.length) {
                    return <div className="text-gray-400 text-center">No RSI data available yet.</div>;
                }

                return (
                    <div className="bg-white rounded-lg p-4">
                        <div className="flex items-center justify-between mb-3">
                            <div className="text-sm font-medium text-gray-500">Current RSI:</div>
                            <div className="text-lg font-bold text-gray-800">
                                {parseFloat(rsiData[rsiData.length - 1]).toFixed(1)}
                            </div>
                        </div>
                        <div className="mb-2">
                            <div className="h-2 w-full bg-gray-200 rounded-full overflow-hidden">
                                <div 
                                    className="h-full bg-blue-500 rounded-full" 
                                    style={{ width: `${Math.min(100, Math.max(0, parseFloat(rsiData[rsiData.length - 1])))}%` }}
                                ></div>
                            </div>
                            <div className="flex justify-between text-xs text-gray-500 mt-1">
                                <span>0</span>
                                <span>Oversold (30)</span>
                                <span>Overbought (70)</span>
                                <span>100</span>
                            </div>
                        </div>
                        <div className="mt-4">
                            <h4 className="text-sm font-medium text-gray-700 mb-2">Recent RSI Values:</h4>
                            <div className="flex flex-wrap">
                                {rsiData.slice(-10).map((value, index) => {
                                    const rsiValue = parseFloat(value);
                                    let valueClass = "rsi-value";
                                    if (rsiValue >= 70) valueClass += " overbought";
                                    if (rsiValue <= 30) valueClass += " oversold";
                                    
                                    return (
                                        <div key={index} className={valueClass}>
                                            {rsiValue.toFixed(1)}
                                        </div>
                                    );
                                })}
                            </div>
                        </div>
                    </div>
                );
            };

            const ModelPredictions = ({ predictions }) => {
                if (!predictions) return <div className="text-gray-400 text-center">No predictions available yet.</div>;
                const currentPrice = predictions.current_price;
                return (
                    <div>
                        <div className="mb-4">
                            <p className="text-gray-700 font-medium">Current Price: <span className="font-bold text-gray-900">${parseFloat(currentPrice).toFixed(2)}</span></p>
                            <p className="text-gray-500 text-sm mt-1">Timestamp: {new Date(predictions.timestamp).toLocaleString()}</p>
                        </div>
                        <h3 className="font-semibold text-gray-800 mb-3">Predicted Prices</h3>
                        <div className="grid grid-cols-2 sm:grid-cols-3 lg:grid-cols-5 gap-3">
                            {predictions.predicted_prices.map((price, index) => {
                                const priceDiff = price - currentPrice;
                                const percentChange = (priceDiff / currentPrice) * 100;
                                const isPositive = priceDiff > 0;
                                return (
                                    <div key={index} className="bg-gray-100 p-3 rounded-lg text-center hover:bg-gray-200 transition-colors">
                                        <div className="text-xs text-gray-500">Step {index + 1}</div>
                                        <div className="font-semibold text-gray-900">${parseFloat(price).toFixed(2)}</div>
                                        <div className={`text-xs font-medium ${isPositive ? 'text-green-600' : 'text-red-600'}`}>{isPositive ? '↑' : '↓'} {Math.abs(percentChange).toFixed(2)}%</div>
                                    </div>
                                );
                            })}
                        </div>
                    </div>
                );
            };

            return (
                <div className="container mx-auto px-4 py-10 max-w-7xl">
                    <header className="mb-10">
                        <div className="flex justify-between items-center">
                            <h1 className="text-3xl font-bold text-gray-900">JEPA Crypto Trading Dashboard</h1>
                            <div className="flex items-center space-x-4">
                                <select
                                    value={symbol}
                                    onChange={handleSymbolChange}
                                    className="symbol-input px-4 py-2 border border-gray-200 rounded-lg shadow-sm bg-white text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500"
                                >
                                    <option value="BTCUSDT">BTC/USDT</option>
                                    <option value="ETHUSDT">ETH/USDT</option>
                                    <option value="BNBUSDT">BNB/USDT</option>
                                    <option value="ADAUSDT">ADA/USDT</option>
                                    <option value="XRPUSDT">XRP/USDT</option>
                                </select>
                                <div className={`status-dot rounded-full w-3 h-3 ${connected ? 'bg-green-500' : 'bg-red-500'}`}></div>
                                <span className="text-sm text-gray-600">{connected ? 'Connected' : 'Disconnected'}</span>
                            </div>
                        </div>
                        {currentPrice && (
                            <div className="mt-4">
                                <h2 className="text-xl">
                                    <span className="text-gray-600">{symbol}:</span>
                                    <span className="font-bold ml-2 text-gray-900">${parseFloat(currentPrice).toFixed(2)}</span>
                                </h2>
                            </div>
                        )}
                    </header>
                    <div className="grid grid-cols-1 lg:grid-cols-2 gap-6">
                        <div className="bg-white p-6 rounded-xl shadow-sm card">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Price Chart</h2>
                            <PriceChart priceData={priceData} tradingActions={tradingActions} />
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm card">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">RSI Indicator</h2>
                            <RSIIndicator rsiData={indicators.rsi || []} />
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm card">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Recent Trading Actions</h2>
                            <TradingActionsList actions={tradingActions} />
                        </div>
                        <div className="bg-white p-6 rounded-xl shadow-sm card">
                            <h2 className="text-xl font-semibold text-gray-900 mb-4">Model Predictions</h2>
                            <ModelPredictions predictions={predictions} />
                        </div>
                    </div>
                </div>
            );
        };

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
